name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Etapa de seguridad previa a la promoción: ningún fichero .env versionado
  # puede contener credenciales de producción (D16, NFR007).
  seguridad:
    name: Verificación de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Comprobar que los ficheros .env versionados no contienen credenciales
        run: ./scripts/check-env-secrets.sh

  # Etapa de seguridad que bloquea la promoción: análisis de vulnerabilidades de
  # las dependencias PHP y Node (D20, NFR008).
  security-scan:
    name: Análisis de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auditoría de las dependencias PHP y Node
        run: ./scripts/security-scan.sh

  # Suite de pruebas del backend con la base de datos en memoria.
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: Dependencias de Composer
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      # La clave de cifrado se genera para la ejecución: nunca se versiona.
      - name: Entorno de pruebas
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Suite de pruebas
        working-directory: backend
        run: php artisan test

  # Estilo del código PHP: el linter falla si encuentra desviaciones.
  pint:
    name: Estilo del código PHP
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Dependencias de Composer
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Comprobación del estilo
        working-directory: backend
        run: ./vendor/bin/pint --test

  # Compilación y pruebas del panel React.
  frontend:
    name: Pruebas del panel
    runs-on: ubuntu-latest
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias de npm
        working-directory: frontend
        run: npm ci

      - name: Comprobación de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Suite de pruebas
        working-directory: frontend
        run: npm test

      - name: Compilación
        working-directory: frontend
        run: npm run build

  # Puerta de seguridad: con `if: always()` la puerta se evalúa siempre y
  # convierte el fallo de cualquier etapa de seguridad en un fallo explícito.
  # La promoción queda bloqueada porque depende de este trabajo.
  security-gate:
    name: Puerta de seguridad
    runs-on: ubuntu-latest
    needs:
      - seguridad
      - security-scan
    if: always()
    steps:
      - name: Comprobar el resultado de las etapas de seguridad
        env:
          SEGURIDAD_RESULT: ${{ needs.seguridad.result }}
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
        run: |
          if [ "$SEGURIDAD_RESULT" != "success" ] || [ "$SECURITY_SCAN_RESULT" != "success" ]; then
            echo "Las etapas de seguridad no son correctas; la promoción queda bloqueada." >&2
            exit 1
          fi
          echo "Las etapas de seguridad son correctas; la promoción está permitida."

  # Promoción a staging: sólo se ejecuta cuando la puerta de seguridad y todas
  # las etapas de verificación han sido correctas (D20).
  staging:
    name: Promoción a staging
    runs-on: ubuntu-latest
    needs:
      - security-gate
      - backend
      - pint
      - frontend
    environment:
      name: staging
      url: https://staging.vaccine-batch-tracking.msd.internal
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Credenciales del registro de imágenes
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Publicar la imagen del BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bff
          push: true
          tags: |
            ${{ vars.REGISTRY }}/msd/vaccine-batch-tracking-bff:staging
            ${{ vars.REGISTRY }}/msd/vaccine-batch-tracking-bff:${{ github.sha }}

  # Promoción a producción: depende de la promoción a staging, de modo que un
  # fallo del análisis de seguridad impide el avance en toda la cadena.
  prod:
    name: Promoción a producción
    runs-on: ubuntu-latest
    needs:
      - security-gate
      - backend
      - pint
      - frontend
      - staging
    environment:
      name: production
      url: https://vaccine-batch-tracking.msd.internal
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Credenciales del registro de imágenes
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Publicar la imagen del panel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: true
          tags: |
            ${{ vars.REGISTRY }}/msd/vaccine-batch-tracking-frontend:production
            ${{ vars.REGISTRY }}/msd/vaccine-batch-tracking-frontend:${{ github.sha }}
