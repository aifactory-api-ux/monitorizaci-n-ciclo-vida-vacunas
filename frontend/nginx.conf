# Configuración del servidor nginx que publica el SPA y reenvía la API y el
# canal WebSocket al servicio `bff`. Se instala en
# /etc/nginx/conf.d/default.conf dentro de la imagen `frontend`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    # Resolución en tiempo de ejecución para no fijar la IP del contenedor `bff`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream bff:80;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: cualquier ruta desconocida devuelve el documento de entrada.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets compilados llevan hash en el nombre y se cachean un año.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # API del BFF.
    location /api/ {
        proxy_pass http://$bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Autenticación del canal WebSocket `batch-monitoring`.
    location /broadcasting/ {
        proxy_pass http://$bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Canal WebSocket `batch-monitoring` (ruta por defecto de Pusher/Reverb).
    location /app/ {
        proxy_pass http://$bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
