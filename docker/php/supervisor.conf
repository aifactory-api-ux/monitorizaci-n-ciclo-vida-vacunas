; Supervisor del contenedor del BFF: php-fpm, trabajador de cola y Reverb.

[supervisord]
nodaemon = true
user = root
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue-worker]
command = php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=120
process_name = %(program_name)s_%(process_num)02d
numprocs = 2
autostart = true
autorestart = true
priority = 20
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:reverb]
command = php artisan reverb:start --host=0.0.0.0 --port=8080
autostart = true
autorestart = true
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
