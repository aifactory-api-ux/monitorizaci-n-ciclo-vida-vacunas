# Servidor HTTP del BFF: publica la API Laravel y reenvía el canal WebSocket
# al servidor Reverb. Se instala en /etc/nginx/http.d/default.conf dentro de
# la imagen `bff` (base php:8.3-fpm-alpine) y lo arranca supervisor junto a
# php-fpm, el trabajador de cola y Reverb.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rutas de la API: cualquier ruta sin fichero real llega a index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ficheros públicos generados por la aplicación (exportes, adjuntos).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Punto de entrada único de PHP: FastCGI hacia php-fpm local.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Cualquier otro script PHP queda fuera del ámbito público.
    location ~ \.php$ {
        return 404;
    }

    # Autorización de los canales privados: la resuelve la aplicación Laravel
    # (`auth:api`), no el servidor Reverb.
    location /broadcasting/ {
        try_files $uri /index.php?$query_string;
    }

    # Canal WebSocket `batch-monitoring` (ruta por defecto de Pusher/Reverb).
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
