# Redis 7 del despliegue del BFF. La persistencia se resuelve con el fichero
# AppendOnly para que las colas y la caché sobrevivan a un reinicio.

bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 300
timeout 0
tcp-backlog 511

daemonize no
supervised no
loglevel notice
logfile ""

# Persistencia AppendOnly.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Instantáneas opcionales como red de seguridad ante corrupción del AOF.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Límite de memoria: `noeviction` evita perder entradas de cola.
maxmemory 512mb
maxmemory-policy noeviction

# Notificación de expiración y hash rápido para el canal de Reverb.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
notify-keyspace-events ""
